# MeridianTech Security Configuration for NGINX
# Add these lines to your server {} block in nginx.conf

# Redirect HTTP to HTTPS
server {
    listen 80;
    server_name meridiantech.co www.meridiantech.co;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name meridiantech.co www.meridiantech.co;
    
    # SSL Configuration
    ssl_certificate /path/to/certificate.crt;
    ssl_certificate_key /path/to/private.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    
    # Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com data:; img-src 'self' data: https:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests" always;
    
    root /var/www/meridian-web;
    index index.html;
    
    # Deny access to sensitive files
    location ~ \.(env|json|lock|sql|config|bak|backup|tmp|md|txt|htaccess)$ {
        deny all;
    }
    
    # Prevent directory listing
    autoindex off;
    
    # Cache control for HTML (no cache)
    location ~ \.html$ {
        expires 0;
        add_header Cache-Control "max-age=0, no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
    }
    
    # Cache CSS and JS (30 days)
    location ~ \.(css|js)$ {
        expires 30d;
        add_header Cache-Control "max-age=2592000, public, immutable" always;
    }
    
    # Cache static assets (1 year)
    location ~ \.(woff|woff2|ttf|eot|svg|gif|png|jpg|jpeg|webp)$ {
        expires 365d;
        add_header Cache-Control "max-age=31536000, public, immutable" always;
    }
    
    # Main content
    location / {
        try_files $uri $uri/ /index.html;
    }
    
    # Error handling
    error_page 404 /index.html;
    error_page 500 502 503 504 /index.html;
}
